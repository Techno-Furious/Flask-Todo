<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Home</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="/about">About</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-dark" type="submit">Search</button>
            </form>
          </div>
        </div>
    </nav>
        <!-- Update Form -->
    <div class="container my-4">
      <h2>Update Task</h2>
      <form action="/update/{{ todo.sno }}" method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" name="title" id="title" value="{{ todo.title }}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="desc" class="form-label">Description</label>
            <input type="text" class="form-control" name="desc" id="desc" value="{{ todo.desc }}">
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="priority" class="form-label">Priority</label>
            <select class="form-select" name="priority" id="priority">
              <option value="High" {% if todo.priority == 'High' %}selected{% endif %}>High</option>
              <option value="Medium" {% if todo.priority == 'Medium' %}selected{% endif %}>Medium</option>
              <option value="Low" {% if todo.priority == 'Low' %}selected{% endif %}>Low</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" name="category" id="category" value="{{ todo.category }}" list="category-list">
            <datalist id="category-list">
              <option value="Work">
              <option value="Personal">
              <option value="Shopping">
              <option value="General">
              <option value="Study">
            </datalist>
          </div>
          <div class="col-md-4 mb-3">
            <label for="due_date" class="form-label">Due Date</label>
            <input type="date" class="form-control" name="due_date" id="due_date" value="{{ todo.due_date.strftime('%Y-%m-%d') if todo.due_date else '' }}">
          </div>
        </div>
        
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="completed" id="completed" {% if todo.completed %}checked{% endif %}>
          <label class="form-check-label" for="completed">
            Mark as completed
          </label>
        </div>
        
        <div class="mb-3">
          <button type="submit" class="btn btn-primary">Update Task</button>
          <a href="/" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
